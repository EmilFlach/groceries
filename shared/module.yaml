product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.foundation
  - $libs.compose.material3
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.kotlinx.coroutines.core
  - $libs.sqlDelight.primitive.adapters
  - $libs.sqlDelight.async.extensions
  - $libs.filekit.core
  - $libs.filekit.dialogs
  - $libs.filekit.dialogs.compose
  - $libs.compose.material.icons.extended
  - $libs.coil.compose
  - $libs.coil.network.ktor3
  - $libs.ktor.client.core

dependencies@android:
  - $compose.uiTooling
  - $libs.kotlinx.coroutines.android
  - $libs.sqlDelight.driver.android
  - $libs.androidx.documentfile
  - $libs.ktor.client.okhttp

dependencies@jvm:
  - $libs.sqlDelight.driver.sqlite
  - $libs.sqlite.jdbc
  - $libs.ktor.client.okhttp

dependencies@native:
  - $libs.sqlDelight.driver.native

dependencies@ios:
  - $libs.ktor.client.darwin

dependencies@wasmJs:
  - $libs.sqlDelight.driver.js

settings:
  compose:
    enabled: true
    resources:
      packageName: com.emilflach.groceries.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
    version: 1.11.1
  kotlin:
    freeCompilerArgs: [-Xexpect-actual-classes]

settings@ios:
  kotlin:
    linkerOptions: [-lsqlite3]

test-dependencies:
  - $libs.kotlinx.coroutines.test

plugins:
  sqldelight:
    enabled: true
    packageName: com.emilflach.groceries
    databaseName: Database
    generateAsync: true
